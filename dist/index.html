<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Hub</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- sprite de icones: traço 1.5, sem preenchimento, herda currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13h5l-1 8 8-10h-5l1-8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6zM12 14v7"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2h12v2"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 4 14 2.5-7h5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-2.5-6.5L4 12z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2.5"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="9" r="2.5"/><path d="M7 8.5v7M17 11.5c0 3-3 3-5 3.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 10h10a5 5 0 0 1 0 10H8M4 10l4-4M4 10l4 4"/></symbol>
    <symbol id="i-compact" viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h16"/><path d="m17 9 3 3-3 3"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-1 5.8V16a3 3 0 0 0 4 2.8V20M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 1 5.8V16a3 3 0 0 1-4 2.8V20M9 4v16M15 4v16"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4zM12 10v4M12 17.5v.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-panel-off" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 9l4 6M19 9l-4 6"/></symbol>
    <symbol id="i-diff" viewBox="0 0 24 24"><path d="M7 4v16M4 7h6M17 20V4M14 17h6"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 13h6m-2-2 2 2-2 2"/></symbol>
    <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15h4.5"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v6M15 3v6M6 9h12v3a6 6 0 0 1-12 0zM12 18v3"/></symbol>
  </defs>
</svg>

<header id="topbar">
  <button id="sidebarToggle" class="icon-btn" type="button" title="Ocultar barra de sessões (Ctrl+B)" aria-expanded="true">
    <svg viewBox="0 0 24 24"><use href="#i-panel"/></svg>
  </button>

  <div class="brand">
    <svg viewBox="0 0 24 24" class="brand-mark"><use href="#i-bolt"/></svg>
    <span class="brand-name">OpenCode Hub</span>
    <button id="connBtn" class="conn" type="button" title="Estado do serviço">
      <span class="conn-dot"></span><span id="connText">conectando</span>
    </button>
  </div>

  <button id="dirBtn" class="dir-picker" type="button" title="Diretório de trabalho">
    <svg viewBox="0 0 24 24"><use href="#i-folder"/></svg>
    <span id="dirLabel">Todos os diretórios</span>
    <svg viewBox="0 0 24 24" class="caret"><use href="#i-chev"/></svg>
  </button>

  <nav id="viewTabs" class="view-tabs" role="tablist">
    <button class="tab active" data-view="foco" role="tab">Foco</button>
    <button class="tab" data-view="paralelo" role="tab">Paralelo<span id="paraleloCount" class="pill"></span></button>
    <button class="tab" data-view="subagentes" role="tab">Subagentes<span id="subCount" class="pill"></span></button>
    <button class="tab" data-view="eventos" role="tab">Eventos<span id="evCount" class="pill"></span></button>
    <button class="tab" data-view="ambiente" role="tab">Ambiente</button>
  </nav>

  <div class="top-actions">
    <button id="newSessionBtn" class="btn primary" type="button" title="Nova sessão (Ctrl+N)">
      <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg><span>Nova</span>
    </button>
    <button id="settingsBtn" class="icon-btn" type="button" title="Ajustes">
      <svg viewBox="0 0 24 24"><use href="#i-sliders"/></svg>
    </button>
  </div>
</header>

<div id="shell">
  <aside id="sidebar">
    <div class="side-head">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="Buscar sessões" autocomplete="off" spellcheck="false">
      </div>
      <button id="subsToggle" class="ghost-btn" type="button" title="Mostrar também as sessões de subagentes">Sub</button>
      <button id="selectModeBtn" class="ghost-btn" type="button" title="Selecionar sessões para excluir em lote">Selecionar</button>
    </div>

    <div id="selectBar" class="select-bar" hidden>
      <div class="sb-row">
        <label class="check">
          <input type="checkbox" id="selectAll"><span id="selectAllLabel">Todas</span>
        </label>
        <span id="selectCount" class="select-count">0 selec.</span>
        <button id="selectCancel" class="ghost-btn" type="button">Concluir</button>
      </div>
      <button id="deleteSelected" class="btn danger sb-delete" type="button" disabled>
        <svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>
        <span>Excluir selecionadas</span>
      </button>
    </div>

    <div id="sessionList" class="session-list" role="listbox"></div>
    <div class="side-foot"><span id="sideStats"></span></div>
  </aside>

  <main id="main"><div id="viewRoot"></div></main>
</div>

<div id="popRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="app.js"></script>
</body>
</html>
